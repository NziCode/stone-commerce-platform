<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" width="200" height="55">
  <defs>
    <style>
      .logo-en { font-family: Georgia, 'Times New Roman', serif; font-weight: 900; }
      .logo-trading { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
      .logo-group { font-family: Arial, sans-serif; font-weight: 400; letter-spacing: 4px; }
    </style>
  </defs>
  <!-- Circle Icon -->
  <circle cx="25" cy="27" r="21" fill="none" stroke="white" stroke-width="2"/>
  <text x="25" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="900" fill="white">EN</text>
  <!-- Brand Name -->
  <text x="55" y="32" class="logo-en" font-size="24" fill="white">EN</text>
  <text x="85" y="32" class="logo-trading" font-size="24" fill="#ff7f2a">Trading</text>
  <text x="55" y="48" class="logo-group" font-size="8" fill="rgba(255,255,255,0.5)">GROUP</text>
</svg>
